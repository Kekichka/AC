name: gates

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run typecheck
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  lint:
    needs: types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run lint
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm test
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-tests
          path: |
            docs/lab3/runs/**
            test-report/**
          if-no-files-found: ignore

  evals:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Детерміновані оцінювачі на замороженому банку
        timeout-minutes: 12
        env:
          EVAL_K: '1'
          EVAL_BUCKET: regression
        run: |
          npx tsx scripts/evals/run-evals.ts docs/lab3/tasks.jsonl
          npx tsx scripts/evals/gate.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: evals
          path: docs/lab3/evals.jsonl
          if-no-files-found: ignore

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: g
        run: |
          npm run build
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-build
          path: .next/**
          if-no-files-found: ignore

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Запуск верифікатора на іншій моделі
        run: npm run verify
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: verdicts
          path: docs/lab3/verdicts/
          if-no-files-found: ignore

  record:
    needs: [types, lint, tests, build, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: incoming
          merge-multiple: true
      - name: Вердикти брам у журнал прогону
        env:
          V_TYPES: ${{ needs.types.result }}
          V_LINT: ${{ needs.lint.result }}
          V_TESTS: ${{ needs.tests.result }}
          V_BUILD: ${{ needs.build.result }}
        run: |
          node scripts/harness/record-gates.mjs \
            --types "$V_TYPES" --lint "$V_LINT" --tests "$V_TESTS" --build "$V_BUILD" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v7
        with:
          name: gate-record
          path: gate-record.json